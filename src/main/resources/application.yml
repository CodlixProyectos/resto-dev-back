spring:
  application:
    name: resto-dev

  # ── Datasource ──
  datasource:
    url: jdbc:postgresql://localhost:5432/resto_dev
    username: postgres
    password: 123456789
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # ── Multi-Tenancy Configuration ──
        multiTenancy: SCHEMA

  # ── Auto Flyway para Esquema Global Admin ──
  flyway:
    enabled: true
    locations: classpath:db/migration/admin
    default-schema: admin
    schemas: admin
    baseline-on-migrate: true

# ── JWT ──
app:
  jwt:
    secret: ZXN0YS1lcy11bmEtY2xhdmUtc2VjcmV0YS1kZS1kZXNhcnJvbGxvLXF1ZS1kZWJlLXNlci1jYW1iaWFkYS1lbi1wcm9kdWNjaW9u
    expiration-ms: 86400000  # 24 horas

# ── Server ──
server:
  port: 8080
