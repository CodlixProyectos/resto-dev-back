spring:
  application:
    name: resto-dev
  config:
    import: optional:file:.env

  # ── Datasource ──
  datasource:
    url: jdbc:postgresql://localhost:5432/resto_dev
    username: postgres
    password: alfredoguzman2
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── JPA / Hibernate ──
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # ── Multi-Tenancy Configuration ──
        multiTenancy: SCHEMA
        connection.handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION

  # ── Auto Flyway para Esquema Global Admin ──
  flyway:
    enabled: true
    locations: classpath:db/migration/admin
    default-schema: admin
    schemas: admin
    baseline-on-migrate: true

# ── JWT ──
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24 horas
  security:
    encryption-key: ${SUNAT_ENCRYPTION_KEY}

# ── Server ──
server:
  port: 8080
  forward-headers-strategy: native
